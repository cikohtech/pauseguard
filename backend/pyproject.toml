[project]
name = "pauseguard-api"
version = "0.1.0"
description = "PauseGuard API: FastAPI + Google ADK agents that check the conversation behind a payment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "google-adk>=2.11.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "google-genai>=2.29.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real Google Cloud services or Gemini (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"
filterwarnings = [
    # Raised inside ADK's own AgentTool / tool-declaration code, not ours (google-adk 2.11).
    "ignore:The `plugins` argument is deprecated:DeprecationWarning",
    "ignore:.*JSON_SCHEMA_FOR_FUNC_DECL is enabled:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[dependency-groups]
agent-evals = [
    "google-adk[eval]>=2.11.0",
]
datagen = [
    "playwright>=1.63.0",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
