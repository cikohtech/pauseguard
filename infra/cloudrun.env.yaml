# Cloud Run env vars for pauseguard-api (make deploy-api passes this with --env-vars-file).
# No secrets here: ADMIN_RESET_TOKEN comes from Secret Manager (--set-secrets).
# Everything else falls back to the defaults in backend/app/config.py.
GOOGLE_CLOUD_PROJECT: pauseguard-sg
GOOGLE_CLOUD_LOCATION: global
GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
GEMINI_MODEL: gemini-3.8-flash
GEMINI_THINKING_LEVEL: LOW
GEMINI_MEDIA_RESOLUTION: MEDIUM
DATA_REGION: asia-southeast1
DATA_BACKEND: bigquery
BQ_DATASET: pauseguard
STATE_BACKEND: firestore
EVIDENCE_BUCKET: pauseguard-sg-pauseguard-evidence
ALLOWED_ORIGINS: https://pauseguard-sg.web.app,https://pauseguard-sg.firebaseapp.com,http://localhost:5173
RATE_LIMIT_CHECKS: 30/hour
RATE_LIMIT_CHECKS_PER_CUSTOMER: 120/hour
LOG_LEVEL: INFO
# /metrics cost per check: gemini-3.8-flash, Standard tier, global, USD per 1M tokens, copied from
# the published price list (eval/pricing.yaml: source URL and date; introductory until 31 Dec 2026).
GEMINI_PRICE_IN_USD_PER_MTOK: "0.75"
GEMINI_PRICE_OUT_USD_PER_MTOK: "3.75"
